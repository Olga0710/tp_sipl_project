name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .
      - name: Type-check (mypy)
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Tests with coverage (>= 80%)
        run: pytest --cov=sipl --cov-report=term-missing --cov-fail-under=80

  build:
    name: build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Smoke test in a clean virtual environment
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/sipl --version
          printf 'begin x := 1 end' | .smoke/bin/sipl run -
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
