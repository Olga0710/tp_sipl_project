name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
      - name: Check tag, version and CHANGELOG, extract release notes
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" --out release_notes.md
      - name: Run tests
        run: pytest -q
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check dist/*
      - name: Smoke test the wheel in a clean virtual environment
        run: |
          python -m venv .smoke
          .smoke/bin/pip install dist/*.whl
          .smoke/bin/sipl --version
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SIPL Toolkit ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
